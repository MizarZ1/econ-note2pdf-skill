name: Engineering checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: advanced-econ-note2pdf/requirements.txt
      - name: Install local processing dependencies
        run: |
          python -m pip install -r advanced-econ-note2pdf/requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
      - name: Check repository and synthetic material pipeline
        run: |
          python tools/check_repo.py
          python tools/dev_check.py
          python tools/package_skill.py
